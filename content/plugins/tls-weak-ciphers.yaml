id: tls-deprecated-or-weak-ciphers
schema_version: 2

info:
  name: Deprecated TLS Protocol or Weak Cipher Suites Detected
  family: tls
  severity: medium
  cve: []
  cwe:
    - CWE-326
    - CWE-327
  references:
    - https://datatracker.ietf.org/doc/html/rfc8996
  description: The target service supports deprecated TLS protocols (TLS 1.0 or 1.1) or weak cipher suites that are vulnerable to known cryptographic downgrade attacks.
  remediation: Disable TLS 1.0 and 1.1; enforce TLS 1.2 and 1.3 with secure AEAD cipher suites (e.g. ECDHE-ECDSA-AES128-GCM-SHA256, ECDHE-RSA-AES128-GCM-SHA256).
  safety: active-safe
  method: active_probe
  confidence: confirmed
  timeout_seconds: 5

requires:
  service:
    - https
    - tls
    - ssl
  ports:
    - 443
    - 8443

matchers_condition: or
matchers:
  - type: tls
    pattern: "weak_ciphers"
  - type: tls
    pattern: "expired"

emit:
  title: Deprecated TLS Protocol or Certificate Issue
  evidence:
    include:
      - tls_info
    max_bytes: 1024
  evidence_signature:
    - tls
    - ciphers
