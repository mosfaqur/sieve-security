id: proftpd-mod-copy-cve-2015-3306
schema_version: 2

info:
  name: ProFTPD mod_copy Arbitrary File Copy Vulnerability
  family: ftp
  severity: critical
  cve:
    - CVE-2015-3306
  cwe:
    - CWE-284
  references:
    - https://nvd.nist.gov/vuln/detail/CVE-2015-3306
  description: The mod_copy module in ProFTPD 1.3.5 allows remote attackers to read and write arbitrary files via the site cpfr and site cpto commands without authentication.
  remediation: Upgrade ProFTPD to 1.3.5a or newer, or disable mod_copy in proftpd.conf.
  safety: active-safe
  method: version_inference
  confidence: probable
  timeout_seconds: 5

requires:
  service:
    - ftp
    - proftpd
  ports:
    - 21

matchers_condition: and
matchers:
  - type: banner
    pattern: "(?i)ProFTPD"
  - type: version
    fixed_in: "1.3.6"
    ecosystem: generic

emit:
  title: ProFTPD mod_copy Remote Arbitrary File Manipulation (CVE-2015-3306)
  evidence:
    include:
      - banner
    max_bytes: 1024
  evidence_signature:
    - proftpd
    - version
